[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-relay"
version = "0.1.0"
description = "Git staging as the human review surface for collaborative agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Agent-Session-Relay contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
relay = "agent_session_relay.cli:main"

[project.urls]
Repository = "https://github.com/Vopaaz/Agent-Session-Relay"
Issues = "https://github.com/Vopaaz/Agent-Session-Relay/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
