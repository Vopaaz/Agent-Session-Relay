[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-relay"
dynamic = ["version"]
description = "Git staging as the human review surface for collaborative agent sessions"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Agent-Session-Relay contributors"}]
dependencies = []
keywords = ["git", "code-review", "ai-agent", "kiro", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
relay = "agent_session_relay.cli:main"

[project.urls]
Homepage = "https://github.com/Vopaaz/Agent-Session-Relay"
Documentation = "https://github.com/Vopaaz/Agent-Session-Relay#readme"
Repository = "https://github.com/Vopaaz/Agent-Session-Relay"
Issues = "https://github.com/Vopaaz/Agent-Session-Relay/issues"

[tool.setuptools.dynamic]
version = {attr = "agent_session_relay.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
