name: Draft release artifacts
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - name: Build and validate PyPI distributions
        run: python scripts/build_pypi.py --tag "$GITHUB_REF_NAME"
      - run: python scripts/build_zipapp.py
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/pypi/* dist/relay.pyz dist/relay.pyz.sha256
          --title "Agent-Session-Relay $GITHUB_REF_NAME"
          --generate-notes --draft
