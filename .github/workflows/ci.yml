name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test real Git workflows
        run: python -m unittest discover -s tests -v
      - name: Build and verify the standalone executable
        run: |
          python scripts/build_zipapp.py
          dist/relay.pyz --version
      - name: Verify Python packaging
        run: |
          python -m pip install .
          relay --version
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build and validate PyPI distributions
        run: python scripts/build_pypi.py
      - name: Install the built wheel
        run: |
          python -m pip install --force-reinstall dist/pypi/*.whl
          relay --version
